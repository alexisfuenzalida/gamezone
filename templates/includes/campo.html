{# Renderiza un campo de formulario con etiqueta, ayuda y errores al estilo Bootstrap #}
<div class="{{ clase|default:'mb-3' }}">
  <label for="{{ campo.id_for_label }}" class="form-label">
    {{ campo.label }}{% if campo.field.required %} <span class="text-danger" aria-hidden="true">*</span>{% endif %}
  </label>
  {{ campo }}
  {% if campo.help_text %}<div class="form-text">{{ campo.help_text|safe }}</div>{% endif %}
  {% for error in campo.errors %}
    <div class="invalid-feedback d-block"><i class="bi bi-exclamation-circle"></i> {{ error }}</div>
  {% endfor %}
</div>
