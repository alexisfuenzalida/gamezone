{% extends 'base.html' %}

{% block titulo %}Crear cuenta{% endblock %}

{% block contenido %}
<div class="container py-5">
  <div class="gz-card mx-auto p-4 p-md-5" style="max-width: 520px;">
    <h1 class="h2 mb-4">Crear cuenta de jugador</h1>
    <form method="post" novalidate>
      {% csrf_token %}
      {% for campo in form %}
        {% include 'includes/campo.html' %}
      {% endfor %}
      <button type="submit" class="btn btn-gz w-100">Crear cuenta</button>
    </form>
  </div>
</div>
{% endblock %}
