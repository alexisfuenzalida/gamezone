{% extends 'base.html' %}

{% block titulo %}Ingresar{% endblock %}

{% block contenido %}
<div class="container py-5">
  <div class="gz-card gz-auth mx-auto p-4 p-md-5">
    <h1 class="h2 mb-1">Ingresar</h1>
    <p class="text-secondary mb-4">Accede con tu cuenta de GAMEZONE.</p>

    {% if form.non_field_errors %}
      <div class="alert alert-danger">Usuario o contraseña incorrectos.</div>
    {% endif %}

    <form method="post" novalidate>
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}">
      <div class="mb-3">
        <label for="{{ form.username.id_for_label }}" class="form-label">Usuario</label>
        <input type="text" name="{{ form.username.html_name }}" id="{{ form.username.id_for_label }}"
               class="form-control" value="{{ form.username.value|default:'' }}" autocomplete="username" required autofocus>
      </div>
      <div class="mb-4">
        <label for="{{ form.password.id_for_label }}" class="form-label">Contraseña</label>
        <input type="password" name="{{ form.password.html_name }}" id="{{ form.password.id_for_label }}"
               class="form-control" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-gz w-100">Ingresar</button>
    </form>

    <p class="text-secondary small text-center mt-4 mb-0">
      ¿No tienes cuenta? <a href="{% url 'registro' %}">Regístrate como jugador</a>
    </p>
  </div>
</div>
{% endblock %}
