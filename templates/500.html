{% load static %}<!doctype html>
{# Página independiente: Django la muestra sin contexto, así que no hereda de base.html ni usa la BD #}
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Error del servidor · GAMEZONE</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="{% static 'css/gamezone.css' %}" rel="stylesheet">
</head>
<body>
  <main class="d-flex align-items-center">
    <div class="container py-5">
      <div class="gz-card mx-auto p-4 p-md-5 text-center" style="max-width: 560px;">
        <i class="bi bi-plug fs-1" style="color: var(--gz-live);"></i>
        <p class="gz-title gz-gradient-text mb-0 mt-2" style="font-size: 4rem; line-height: 1;">500</p>
        <h1 class="h3 mt-2">Algo salió mal</h1>

    </div>
