{% extends 'base.html' %}

{% block titulo %}{{ titulo }}{% endblock %}

{% block contenido %}
<div class="container py-4">
  <div class="gz-card p-4 p-md-5 mx-auto" style="max-width: 720px;">
    <h1 class="h2 mb-4">{{ titulo }}</h1>
    <form method="post" novalidate>
      {% csrf_token %}
      {% for campo in form %}
        {% include 'includes/campo.html' %}
      {% endfor %}
      <button type="submit" class="btn btn-gz"><i class="bi bi-check-lg"></i> Guardar</button>
      <a href="{% url 'torneos:lista' %}" class="btn btn-gz-outline">Cancelar</a>
    </form>
  </div>
</div>
{% endblock %}
