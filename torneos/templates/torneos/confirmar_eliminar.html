{% extends 'base.html' %}

{% block titulo %}Eliminar torneo{% endblock %}

{% block contenido %}
<div class="container py-5">
  <div class="gz-card p-4 p-md-5 mx-auto text-center" style="max-width: 560px;">
    <h1 class="h3">¿Eliminar "{{ torneo.nombre }}"?</h1>
    <p class="text-secondary">También se eliminarán sus inscripciones y resultados. Esta acción no se puede deshacer.</p>
    <form method="post">
      {% csrf_token %}
      <a href="{% url 'torneos:detalle' torneo.pk %}" class="btn btn-gz-outline">Cancelar</a>
      <button type="submit" class="btn btn-danger"><i class="bi bi-trash"></i> Sí, eliminar</button>
    </form>
  </div>
</div>
{% endblock %}
